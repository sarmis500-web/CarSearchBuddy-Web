<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Car Lease Buddy — New Car Lease Deals & Used Car Search</title>
<meta name="description" content="Find manufacturer-advertised lease deals re-priced for your own term, down payment, and mileage — plus hundreds of thousands of used cars at dealers nationwide. Free, no signup.">
<link rel="canonical" href="https://sarmis500-web.github.io/CarSearchBuddy-Web/">
<meta property="og:title" content="Car Lease Buddy — New Car Lease Deals & Used Car Search">
<meta property="og:description" content="Advertised lease specials re-priced for your term, down payment, and mileage — plus nationwide used-car search. Free, no signup.">
<meta property="og:url" content="https://sarmis500-web.github.io/CarSearchBuddy-Web/">
<meta property="og:site_name" content="Car Lease Buddy">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sarmis500-web.github.io/CarSearchBuddy-Web/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="bg"></div>

<!-- ===== HOME (mirrors native App.kt HomeScreen exactly) ===== -->
<section id="home" class="screen active">
  <div class="home-inner">
    <h1 class="home-title">Car Lease Buddy</h1>
    <p class="home-sub">New Car Lease &amp; Used Car Deal Finder</p>
    <div class="home-row top">
      <button class="home-btn" data-go="leases">Find Lease Deals</button>
      <button class="home-btn" data-go="inventory">Search Used Cars</button>
    </div>
    <div class="home-row center">
      <button class="home-btn" data-go="calculator">Payment Calculator</button>
    </div>
    <!-- Crawl path into the static SEO pages (build_seo_pages.py). Kept tiny/muted
         so the screen still reads like the native Home. -->
    <nav class="home-browse">
      <a href="lease-deals/">Lease deals by model</a> · <a href="used-cars/">Used car prices</a>
    </nav>
  </div>
</section>

<!-- ===== INVENTORY (mirrors native InventoryScreen.kt: top bar + FilterBar) ===== -->
<section id="inventory" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Used Cars</span>
    <button class="tb-btn" data-act="inv-startover">Start Over</button>
  </header>
  <!-- Native FilterBar: "{N} vehicles" left, white Filters pill right, active chips below.
       ZIP/distance live INSIDE the filter sheet (native has no ZIP row on this screen). -->
  <div class="lease-bar">
    <div class="lease-bar-row">
      <span id="inv-count" class="lease-count">Loading…</span>
      <span class="lease-bar-actions">
        <button id="inv-clear" class="lease-clear" data-act="inv-clear" hidden>Clear</button>
        <button class="lease-filters" data-act="inv-filter">Filters</button>
      </span>
    </div>
    <div id="inv-chips" class="lease-active-chips"></div>
  </div>
  <div id="inv-list" class="card-list"></div>
  <div id="inv-more"></div>
</section>

<!-- ===== LEASES (mirrors native LeaseScreen.kt: FilterBar + LeaseOfferCard) ===== -->
<section id="leases" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Lease Deals</span>
    <button class="tb-btn" data-act="lease-startover">Start Over</button>
  </header>
  <div class="lease-bar">
    <div class="lease-bar-row">
      <span id="lease-count" class="lease-count">0 offers</span>
      <span class="lease-bar-actions">
        <button class="lease-clear" data-act="lease-clear">Clear</button>
        <button class="lease-filters" data-act="lease-filter">Filters</button>
      </span>
    </div>
    <!-- Mirrors native LeaseScreen's pre-tax disclosure line (same copy, same position:
         under the offer count, above the active-filter chips). Every payment shown is the
         PRE-TAX base payment — that is how OEMs quote lease specials and what the engine
         computes; lease sales tax varies by state. -->
    <div class="lease-taxnote">Payments are before tax, title &amp; fees — these vary by state.</div>
    <!-- Dynamic explainers — same copy and same position as native FilterBar (under the
         pre-tax note, above the active-filter chips). Filled by app.js, empty = invisible. -->
    <div id="lease-downtrade" class="lease-note-accent"></div>
    <div id="lease-cliffnote" class="lease-note-accent"></div>
    <div id="lease-chips" class="lease-active-chips"></div>
  </div>
  <div id="lease-list" class="card-list lease-list"></div>
  <div id="lease-more"></div>
</section>

<!-- ===== CALCULATOR (mirrors native PaymentCalculatorScreen.kt) ===== -->
<section id="calculator" class="screen">
  <div class="calc-dim"></div>
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Payment Calculator</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div class="calc-col">
    <div id="calc-fields"></div>
    <div class="calc-term-label">Loan term</div>
    <div id="calc-terms" class="term-chips"></div>
    <button id="calc-go" class="calc-go-btn" disabled>Enter a vehicle price</button>
    <div id="calc-result"></div>
  </div>
</section>

<!-- ===== SAVED ===== -->
<section id="saved" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Saved &amp; Alerts</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div id="saved-list" class="card-list"></div>
</section>

<!-- ===== FILTER SHEET (shared; mirrors native full-screen FilterSheet over the showroom photo) ===== -->
<div id="sheet" class="sheet-overlay">
  <div class="fsheet">
    <header class="fsheet-head">
      <button class="fsheet-back" data-act="sheet-back" aria-label="Back">←</button>
      <span class="fsheet-title">Filters</span>
      <button class="fsheet-reset" data-act="sheet-reset">Start Over</button>
    </header>
    <div class="fsheet-rule"></div>
    <div id="sheet-body" class="fsheet-body"></div>
    <div class="fsheet-foot">
      <button id="sheet-apply" class="fsheet-apply">Show results</button>
    </div>
  </div>
</div>

<!-- ===== DEALER LINKS POPUP (native DealerLinksSheet) ===== -->
<div id="dealer-sheet" class="sheet-overlay">
  <div class="dsheet">
    <div class="dsheet-grab"></div>
    <div id="dsheet-body" class="dsheet-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="vendor/httpvfs.js?v=1"></script>
<script src="engine.js?v=11"></script>
<script src="db.js?v=18"></script>
<script src="app.js?v=24"></script>

<!-- Never-stale updates: register the freshness SW and auto-refresh when a new build
     is live. updateViaCache:'none' keeps GitHub's 10-min cache from pinning sw.js so
     updates actually propagate. The SW only force-refreshes the HTML shell; it never
     touches the cross-origin R2 DB range reads (see sw.js). -->
<script>
  if ('serviceWorker' in navigator) {
    // Only auto-reload on a REAL update: a controller must have ALREADY been in charge
    // when this page loaded (captured now, before register()). On a first-ever visit
    // there's no controller yet, so we never bounce the user with a startup reload.
    // The flag guards against controllerchange firing more than once.
    var _csbHadController = !!navigator.serviceWorker.controller;
    var _csbReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (_csbReloading || !_csbHadController) return;
      _csbReloading = true;
      window.location.reload();
    });
    var _csbReg = null;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) { _csbReg = reg; if (reg && reg.update) reg.update(); })
        .catch(function () {});
    });
    // Re-check for a fresh build every time the user reopens/returns to the tab (or
    // resumes an installed PWA from the background). If a new build is live, the new SW
    // installs and the controllerchange handler above reloads once — no manual refresh.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && _csbReg && _csbReg.update) {
        try { _csbReg.update(); } catch (e) {}
      }
    });
  }
</script>
</body>
</html>
