<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Car Lease Buddy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>

<!-- ===== HOME (mirrors native App.kt HomeScreen exactly) ===== -->
<section id="home" class="screen active">
  <div class="home-inner">
    <h1 class="home-title">Car Lease Buddy</h1>
    <p class="home-sub">New Car Lease &amp; Used Car Deal Finder</p>
    <div class="home-row top">
      <button class="home-btn" data-go="leases">Find Lease Deals</button>
      <button class="home-btn" data-go="inventory">Search Used Cars</button>
    </div>
    <div class="home-row center">
      <button class="home-btn" data-go="calculator">Payment Calculator</button>
    </div>
  </div>
</section>

<!-- ===== INVENTORY (mirrors native InventoryScreen.kt: top bar + FilterBar) ===== -->
<section id="inventory" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Used Cars</span>
    <span class="tb-btn ghost"></span>
  </header>
  <!-- Native FilterBar: "{N} vehicles" left, white Filters pill right, active chips below.
       ZIP/distance live INSIDE the filter sheet (native has no ZIP row on this screen). -->
  <div class="lease-bar">
    <div class="lease-bar-row">
      <span id="inv-count" class="lease-count">Loading…</span>
      <span class="lease-bar-actions">
        <button id="inv-clear" class="lease-clear" data-act="inv-clear" hidden>Clear</button>
        <button class="lease-filters" data-act="inv-filter">Filters</button>
      </span>
    </div>
    <div id="inv-chips" class="lease-active-chips"></div>
  </div>
  <div id="inv-list" class="card-list"></div>
  <div id="inv-more"></div>
</section>

<!-- ===== LEASES (mirrors native LeaseScreen.kt: FilterBar + LeaseOfferCard) ===== -->
<section id="leases" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Lease Deals</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div class="lease-bar">
    <div class="lease-bar-row">
      <span id="lease-count" class="lease-count">0 offers</span>
      <span class="lease-bar-actions">
        <button class="lease-clear" data-act="lease-clear">Clear</button>
        <button class="lease-filters" data-act="lease-filter">Filters</button>
      </span>
    </div>
    <div id="lease-chips" class="lease-active-chips"></div>
  </div>
  <div id="lease-list" class="card-list lease-list"></div>
  <div id="lease-more"></div>
</section>

<!-- ===== CALCULATOR (mirrors native PaymentCalculatorScreen.kt) ===== -->
<section id="calculator" class="screen">
  <div class="calc-dim"></div>
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Payment Calculator</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div class="calc-col">
    <div id="calc-fields"></div>
    <div class="calc-term-label">Loan term</div>
    <div id="calc-terms" class="term-chips"></div>
    <button id="calc-go" class="calc-go-btn" disabled>Enter a vehicle price</button>
    <div id="calc-result"></div>
  </div>
</section>

<!-- ===== SAVED ===== -->
<section id="saved" class="screen">
  <header class="topbar">
    <button class="tb-btn tb-back" data-go="home" aria-label="Back">←</button>
    <span class="tb-title">Saved &amp; Alerts</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div id="saved-list" class="card-list"></div>
</section>

<!-- ===== FILTER SHEET (shared; mirrors native full-screen FilterSheet over the showroom photo) ===== -->
<div id="sheet" class="sheet-overlay">
  <div class="fsheet">
    <header class="fsheet-head">
      <button class="fsheet-back" data-act="sheet-back" aria-label="Back">←</button>
      <span class="fsheet-title">Filters</span>
      <button class="fsheet-reset" data-act="sheet-reset">Start Over</button>
    </header>
    <div class="fsheet-rule"></div>
    <div id="sheet-body" class="fsheet-body"></div>
    <div class="fsheet-foot">
      <button id="sheet-apply" class="fsheet-apply">Show results</button>
    </div>
  </div>
</div>

<!-- ===== DEALER LINKS POPUP (native DealerLinksSheet) ===== -->
<div id="dealer-sheet" class="sheet-overlay">
  <div class="dsheet">
    <div class="dsheet-grab"></div>
    <div id="dsheet-body" class="dsheet-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="vendor/httpvfs.js"></script>
<script src="engine.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
