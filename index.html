<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Car Lease Buddy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>

<!-- ===== HOME ===== -->
<section id="home" class="screen active">
  <div class="home-inner">
    <h1 class="home-title">Car Lease Buddy</h1>
    <p class="home-sub">Nationwide lease deals · used-car search · payment math</p>
    <div class="home-buttons">
      <button class="home-btn" data-go="leases"><span class="hb-title">Find Lease Deals</span><span class="hb-sub">Advertised leases, re-priced for any term</span></button>
      <button class="home-btn" data-go="inventory"><span class="hb-title">Search Used Cars</span><span class="hb-sub">368k+ cars nationwide, near you</span></button>
      <button class="home-btn" data-go="calculator"><span class="hb-title">Payment Calculator</span><span class="hb-sub">Auto-loan payment estimator</span></button>
    </div>
    <button class="home-saved" data-go="saved">★ Saved &amp; Alerts</button>
  </div>
</section>

<!-- ===== INVENTORY ===== -->
<section id="inventory" class="screen">
  <header class="topbar">
    <button class="tb-btn" data-go="home">‹ Back</button>
    <span class="tb-title">Used Cars</span>
    <button class="tb-btn" data-act="inv-filter">Filters</button>
  </header>
  <div class="loc-row">
    <input id="inv-zip" class="zip-input" inputmode="numeric" maxlength="5" placeholder="ZIP for distance">
    <button id="inv-geo" class="chip">📍 Near me</button>
    <span id="inv-loc-label" class="loc-label"></span>
  </div>
  <div id="inv-count" class="count-row"></div>
  <div id="inv-list" class="card-list"></div>
  <div id="inv-more"></div>
</section>

<!-- ===== LEASES ===== -->
<section id="leases" class="screen">
  <header class="topbar">
    <button class="tb-btn" data-go="home">‹ Back</button>
    <span class="tb-title">Lease Deals</span>
    <button class="tb-btn" data-act="lease-filter">Filters</button>
  </header>
  <div class="loc-row">
    <input id="lease-zip" class="zip-input" inputmode="numeric" maxlength="5" placeholder="ZIP for dealers">
    <div class="term-seg" id="lease-term">
      <button class="seg active" data-term="adv">Advertised</button>
      <button class="seg" data-term="24">24</button>
      <button class="seg" data-term="36">36</button>
      <button class="seg" data-term="39">39</button>
      <button class="seg" data-term="48">48</button>
    </div>
  </div>
  <div id="lease-count" class="count-row"></div>
  <div id="lease-list" class="card-list"></div>
  <div id="lease-more"></div>
</section>

<!-- ===== CALCULATOR ===== -->
<section id="calculator" class="screen">
  <header class="topbar">
    <button class="tb-btn" data-go="home">‹ Back</button>
    <span class="tb-title">Payment Calculator</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div class="calc-wrap glass">
    <div id="calc-result" class="calc-result">
      <div class="calc-monthly">$0<span>/mo</span></div>
      <div class="calc-sub">Enter a price to start</div>
    </div>
    <div class="calc-grid" id="calc-grid"></div>
  </div>
</section>

<!-- ===== SAVED ===== -->
<section id="saved" class="screen">
  <header class="topbar">
    <button class="tb-btn" data-go="home">‹ Back</button>
    <span class="tb-title">Saved &amp; Alerts</span>
    <span class="tb-btn ghost"></span>
  </header>
  <div id="saved-list" class="card-list"></div>
</section>

<!-- ===== FILTER SHEET (shared) ===== -->
<div id="sheet" class="sheet-overlay">
  <div class="sheet glass">
    <header class="sheet-head">
      <button class="tb-btn" data-act="sheet-back">‹ Back</button>
      <span class="tb-title" id="sheet-title">Filters</span>
      <button class="tb-btn" data-act="sheet-reset">Start Over</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
    <button id="sheet-apply" class="apply-btn">Show results</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="vendor/httpvfs.js"></script>
<script src="engine.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
